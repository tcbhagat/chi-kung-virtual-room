<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9fc9c0">
  <title>Qi Gong Shared Practice Room</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #effff9; }
    body { margin: 0; overflow: hidden; background: #88b9b0; }
    .room-hud {
      position: fixed; z-index: 10; top: 16px; left: 16px; width: min(310px, calc(100% - 32px));
      padding: 14px 16px; border: 1px solid rgba(255,255,255,.32); border-radius: 16px;
      background: rgba(5,30,25,.72); box-shadow: 0 12px 40px rgba(0,0,0,.2); backdrop-filter: blur(12px);
    }
    .room-hud h1 { margin: 0 0 5px; font-size: 1.02rem; }
    .room-hud p { margin: 0; color: #bdd9d0; font-size: .76rem; line-height: 1.45; }
    .room-status { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .76rem; font-weight: 700; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #fdb022; box-shadow: 0 0 10px currentColor; }
    .status-dot.connected { color: #32d583; background: #32d583; }
    .report-button { margin-top: 11px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; background: rgba(255,255,255,.08); color: #eafff5; font: 700 .72rem Inter,system-ui; cursor: pointer; }
    .controls-hint { position: fixed; z-index: 10; right: 16px; bottom: 16px; padding: 9px 12px; border-radius: 10px; background: rgba(5,30,25,.68); color: #d6eee6; font-size: .72rem; }
    @media (max-width: 600px) { .controls-hint { display: none; } }
  </style>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/networked-aframe@0.14.0/dist/networked-aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
  <script src="avatar_bridge.js"></script>
  <script src="diagnostics.js"></script>
  <script src="telemetry_logger.js"></script>
  <script src="room_pose_capture.js"></script>
</head>
<body>
  <aside class="room-hud">
    <h1>Shared Qi Gong Room</h1>
    <p>Pose movements are synchronized at 15 FPS. Rendering follows your display refresh rate.</p>
    <div class="room-status"><i id="status-dot" class="status-dot"></i><span id="network-status">Waiting for device check…</span></div>
    <div class="room-status"><i id="tracking-dot" class="status-dot"></i><span id="tracking-status">Camera not started</span></div>
    <button id="download-test-report" class="report-button" type="button">Download Test Report</button>
  </aside>
  <div class="controls-hint">Desktop: WASD + mouse · Headset: Enter VR</div>
  <video id="pose-input-video" playsinline muted aria-hidden="true" style="position:fixed;width:1px;height:1px;opacity:.001;pointer-events:none"></video>

  <a-scene
    renderer="antialias: true; colorManagement: true"
    background="color: #9fc9c0"
    fog="type: exponential; color: #9fc9c0; density: 0.018"
    webxr="referenceSpaceType: local-floor; optionalFeatures: bounded-floor, hand-tracking"
    networked-scene="serverURL: /; app: qigong-circle; room: shared-practice; connectOnLoad: false; adapter: socketio; audio: false; video: false; debug: false"
    shadow="type: pcfsoft">

    <a-assets>
      <template id="avatar-template">
        <a-entity avatar-bridge pose-packet>
          <a-sphere class="avatar-head" radius="0.14" color="#d8b58d" shadow></a-sphere>
          <a-sphere class="avatar-left-hand" radius="0.085" color="#d8b58d" shadow></a-sphere>
          <a-sphere class="avatar-right-hand" radius="0.085" color="#d8b58d" shadow></a-sphere>
          <a-cylinder class="avatar-torso" radius="0.22" height="0.72" color="#4ea985" shadow></a-cylinder>
        </a-entity>
      </template>
    </a-assets>

    <a-sky color="#9fc9c0"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#8eb59e" roughness="1" shadow="receive: true"></a-plane>
    <a-circle position="0 0.012 0" rotation="-90 0 0" radius="4.2" color="#c7d7b2"></a-circle>
    <a-ring position="0 0.018 0" rotation="-90 0 0" radius-inner="3.2" radius-outer="3.24" color="#f5e7bd"></a-ring>

    <a-entity light="type: ambient; color: #d9fff1; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; color: #fff6d8; intensity: 0.65; castShadow: true" position="-4 8 5"></a-entity>
    <a-entity light="type: hemisphere; color: #c6f4e2; groundColor: #607b69; intensity: 0.45"></a-entity>

    <a-entity position="-5 0 -4">
      <a-cylinder radius="0.32" height="2.6" color="#725b44"></a-cylinder>
      <a-sphere position="0 2.1 0" radius="1.3" color="#5e936c"></a-sphere>
    </a-entity>
    <a-entity position="5 0 -5">
      <a-cylinder radius="0.28" height="2.3" color="#725b44"></a-cylinder>
      <a-sphere position="0 1.9 0" radius="1.15" color="#6b9d72"></a-sphere>
    </a-entity>

    <a-entity
      id="player"
      data-local-avatar
      position="0 0 4"
      wasd-controls="acceleration: 16"
      networked="template: #avatar-template; attachTemplateToLocal: true">
      <a-entity id="view-camera" camera look-controls position="0 1.62 0"></a-entity>
      <a-entity hand-controls="hand: left; handModelStyle: lowPoly"></a-entity>
      <a-entity hand-controls="hand: right; handModelStyle: lowPoly"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
